<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Editar hotspots · Gutiérrez Vidal</title>
  <link rel="stylesheet" href="editor.css">
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
  <main class="hotspot-editor">
    <nav class="editor-nav hotspot-nav">
      <a href="index.html">← Herramientas</a>
      <a href="content.html">Crear contenido</a>
    </nav>

    <header class="hotspot-header">
      <div>
        <p class="eyebrow">Panorama</p>
        <h1>Editar hotspots</h1>
        <p class="privacy">Arrastra las etiquetas. El botón guarda únicamente el archivo modificado dentro del paquete de actualización que sustituye a <code>src/data/hotspots.json</code>.</p>
      </div>
      <button id="download-hotspots" class="primary" type="button">Guardar hotspots</button>
    </header>

    <p id="hotspot-status" class="status status-box" role="status">Cargando hotspots actuales…</p>

    <section id="hotspot-stage" aria-label="Editor visual de hotspots">
      <img src="../public/panorama/portada.jpg" alt="Panorama de la biblioteca y estudio">
    </section>
  </main>
  <script src="workspace.js"></script>
<script src="hotspots.js"></script>
</body>
</html>
