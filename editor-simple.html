<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editar enlaces · Carlos Adolfo Gutiérrez Vidal</title>
<style>
*{box-sizing:border-box}
:root{--paper:#eee9dc;--ink:#151410;--rule:rgba(21,20,16,.48)}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,"Times New Roman",serif}
header{padding:18px 20px;border-bottom:1px solid var(--rule);display:flex;gap:20px;align-items:center;justify-content:space-between}
h1{font-size:21px;letter-spacing:.12em;text-transform:uppercase;margin:0;font-weight:400}
button{font:inherit;padding:9px 12px;border:1px solid var(--ink);background:transparent;color:var(--ink)}
#stage{position:relative;width:100%;aspect-ratio:2/1;background:#111;overflow:hidden;touch-action:none}
#stage img{width:100%;height:100%;display:block;object-fit:fill;pointer-events:none}
.marker{position:absolute;transform:translate(-50%,-50%);border:1px solid #fff;border-radius:0;background:rgba(0,0,0,.76);color:#fff;padding:7px 10px;letter-spacing:.06em;text-transform:uppercase;touch-action:none}
p{margin:5px 0 0;color:#5c594f;font-size:14px;font-style:italic}
</style>
</head>
<body>
<header>
<div>
<h1>Editar enlaces</h1>
<p>Arrastra las etiquetas y pulsa Descargar JSON.</p>
</div>
<button id="download">Descargar JSON</button>
</header>
<div id="stage">
<img src="public/panorama/portada.jpg" alt="">
</div>
<script>
const W=1774,H=887;
const hotspots=[{"id": "escritura", "label": "Escritura", "imageX": 1098, "imageY": 495, "url": "escritura.html"}, {"id": "blog", "label": "Blog", "imageX": 655, "imageY": 470, "url": "blog.html"}, {"id": "sonido", "label": "Sonido", "imageX": 1262, "imageY": 463, "url": "sonido.html"}, {"id": "sistema", "label": "Sistema", "imageX": 470, "imageY": 450, "url": "sistema.html"}, {"id": "perfil", "label": "Perfil", "imageX": 885, "imageY": 365, "url": "perfil.html"}, {"id": "materia", "label": "Materia", "imageX": 104, "imageY": 498, "url": "materia.html"}, {"id": "imagenes", "label": "Imágenes", "imageX": 1282, "imageY": 308, "url": "imagenes.html"}, {"id": "archivo", "label": "Archivo", "imageX": 1510, "imageY": 338, "url": "archivo.html"}];
const stage=document.querySelector('#stage');

function place(el,h){
  el.style.left=(h.imageX/W*100)+'%';
  el.style.top=(h.imageY/H*100)+'%';
}

hotspots.forEach((h,i)=>{
  const el=document.createElement('button');
  el.className='marker';
  el.textContent=h.label;
  el.type='button';
  place(el,h);
  stage.appendChild(el);

  el.addEventListener('pointerdown',e=>{
    e.preventDefault();
    el.setPointerCapture(e.pointerId);
    const move=ev=>{
      const r=stage.getBoundingClientRect();
      const x=Math.max(0,Math.min(r.width,ev.clientX-r.left));
      const y=Math.max(0,Math.min(r.height,ev.clientY-r.top));
      h.imageX=Math.round(x/r.width*W);
      h.imageY=Math.round(y/r.height*H);
      place(el,h);
    };
    const end=()=>{
      el.removeEventListener('pointermove',move);
      el.removeEventListener('pointerup',end);
      el.removeEventListener('pointercancel',end);
    };
    el.addEventListener('pointermove',move);
    el.addEventListener('pointerup',end);
    el.addEventListener('pointercancel',end);
  });
});

document.querySelector('#download').addEventListener('click',()=>{
  const blob=new Blob([JSON.stringify(hotspots,null,2)+'\n'],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='hotspots.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
});
</script>
</body>
</html>
